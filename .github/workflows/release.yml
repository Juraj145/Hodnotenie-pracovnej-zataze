# Zostavenie SPU-Zataz.exe a zverejnenie nového vydania.
# Spustí sa po nahratí tagu v tvare vX.Y.Z (napr. v0.2.0), alebo ručne v záložke Actions.
name: Vydanie (build exe)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      verzia:
        description: "Verzia vydania (napr. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inštalácia závislostí
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Testy výpočtov
        run: python -m pytest -q tests

      - name: Nastavenie verzie
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") { $v = "${{ github.event.inputs.verzia }}" } else { $v = "${{ github.ref_name }}" }
          $v = $v.TrimStart("v")
          (Get-Content spu_zataz/version.py) -replace '__version__ = ".*"', "__version__ = `"$v`"" | Set-Content -Encoding utf8 spu_zataz/version.py
          "verzia=$v" >> $env:GITHUB_OUTPUT

      - name: PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed --name SPU-Zataz
          --icon assets/icon.ico --add-data "assets/icon.ico;assets"
          main.py

      - name: Test výmeny exe pri aktualizácii
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "upd"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist/SPU-Zataz.exe $dir
          $marker = Join-Path $dir "vysledok.txt"
          Start-Process -FilePath (Join-Path $dir "SPU-Zataz.exe") -ArgumentList "--test-aktualizacie", $marker -Wait
          for ($i = 0; $i -lt 60 -and -not (Test-Path $marker); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $marker)) { throw "Nová verzia sa po výmene nespustila." }
          Get-Content $marker
          if (-not (Select-String -Path $marker -Pattern "upratane=True" -Quiet)) { throw "Stará verzia nebola zmazaná." }
          if (-not (Test-Path (Join-Path $dir "SPU-Zataz.exe"))) { throw "Chýba SPU-Zataz.exe po výmene." }
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Balík pre spustenie cez Python
        run: |
          pip install --target build/lib openpyxl
          python tools/zostav_balik.py build/lib dist/SPU-Zataz-python.zip

      - name: Test aktualizácie balíka pre Python
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "pyinst"
          Expand-Archive dist/SPU-Zataz-python.zip -DestinationPath $dir -Force
          $marker = Join-Path $env:RUNNER_TEMP "vysledok-py.txt"
          $zip = (Resolve-Path dist/SPU-Zataz-python.zip).Path
          python (Join-Path $dir "SPU-Zataz.pyw") --test-aktualizacie $marker $zip
          for ($i = 0; $i -lt 60 -and -not (Test-Path $marker); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $marker)) { throw "Nová verzia sa po aktualizácii nespustila." }
          Get-Content $marker
          if (-not (Select-String -Path $marker -Pattern "rezim=python" -Quiet)) { throw "Nesprávny režim." }
          if (-not (Select-String -Path $marker -Pattern "upratane=True" -Quiet)) { throw "Stará verzia nebola zmazaná." }
          Get-ChildItem $dir | Format-Table Name

      - name: Kontrolné súčty
        shell: pwsh
        run: |
          foreach ($f in "SPU-Zataz.exe", "SPU-Zataz-python.zip") {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f" | Set-Content -NoNewline -Encoding ascii "dist/$f.sha256"
          }

      - name: Zverejnenie vydania
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.verzia }}
          name: Verzia ${{ steps.ver.outputs.verzia }}
          generate_release_notes: true
          body: |
            **Inštalácia (odporúčané):** stiahnite `SPU-Zataz-python.zip`, rozbaľte ho a spustite `SPU-Zataz.pyw` (potrebný Python z python.org). Návod je v súbore NAVOD.txt.
            `SPU-Zataz.exe` funguje iba tam, kde ho nezablokuje inteligentné riadenie aplikácií (nie je digitálne podpísaný).
          files: |
            dist/SPU-Zataz-python.zip
            dist/SPU-Zataz-python.zip.sha256
            dist/SPU-Zataz.exe
            dist/SPU-Zataz.exe.sha256
